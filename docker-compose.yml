services:
  postgres:
    image: postgres:16-alpine
    container_name: intelligence_crm_postgres
    environment:
      POSTGRES_DB: company_intelligence_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d company_intelligence_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: intelligence_crm_redis
    ports:
      - "${REDIS_PORT:-6381}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: intelligence_crm_backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/company_intelligence_crm
      SYNC_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/company_intelligence_crm
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-random-secret-key-64chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      EMAIL_DRY_RUN: ${EMAIL_DRY_RUN:-true}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: intelligence_crm_celery_worker
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -c 4
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/company_intelligence_crm
      SYNC_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/company_intelligence_crm
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-random-secret-key-64chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: intelligence_crm_celery_beat
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/company_intelligence_crm
      SYNC_DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/company_intelligence_crm
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-random-secret-key-64chars}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: intelligence_crm_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
